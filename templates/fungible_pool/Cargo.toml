[package]
name = "fungible_pool"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Pinned to development HEAD (2d6083e6cc7c98cde93dacebe2fb76b17703f588) for compatibility with local C:\tmp-tari checkout
tari_template_abi = { git = "https://github.com/tari-project/tari-ootle.git", rev = "2d6083e6cc7c98cde93dacebe2fb76b17703f588" }
tari_template_lib = { git = "https://github.com/tari-project/tari-ootle.git", rev = "2d6083e6cc7c98cde93dacebe2fb76b17703f588" }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"

[features]
default = []