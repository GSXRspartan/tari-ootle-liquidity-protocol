name: Node Tests

# Runs the TypeScript package builds and test suites (protocol-client, wallet-adapter).
# This is the validation channel for packages whose local environment may be offline.

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"
      - "security/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: npm install

      - name: protocol-client build + tests
        run: |
          cd packages/protocol-client
          npm run typecheck
          npm test

      - name: wallet-adapter build + tests
        run: |
          cd ../wallet-adapter
          npm run typecheck
          npm test