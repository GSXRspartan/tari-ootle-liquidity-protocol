name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # pnpm MUST be installed before setup-node so any pnpm-aware step can find it. (Previously
      # setup-node ran with `cache: 'pnpm'` before pnpm existed → "Unable to locate executable
      # file: pnpm".) Pin to pnpm 9 to honor package.json `engines.pnpm >= 9.0.0`.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # NOTE: this repo currently ships no pnpm-lock.yaml (only a stray npm package-lock.json), so
      # setup-node's `cache: 'pnpm'` and `--frozen-lockfile` cannot be used yet — both need a
      # committed pnpm-lock.yaml. Once one is generated and committed, re-add `cache: 'pnpm'` above
      # and switch this to `--frozen-lockfile` for reproducible, cached installs.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build static web app
        run: pnpm --filter @tari-ootle/web build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
